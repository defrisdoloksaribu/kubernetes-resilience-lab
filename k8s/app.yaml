apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: resilience-api
    spec:
      containers:
        - name: api
          image: resilience-api:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-api
spec:
  type: ClusterIP
  selector:
    app: resilience-api
  ports:
    - name: http
      port: 8000
      targetPort: http
